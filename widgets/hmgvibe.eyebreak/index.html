<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="track" cx="50" cy="50" r="44"/>
    <circle class="arc" id="arc" cx="50" cy="50" r="44" pathLength="100"/>
    <path class="eye" d="M28 50s9-13 22-13 22 13 22 13-9 13-22 13-22-13-22-13z"/>
    <circle class="pupil" cx="50" cy="50" r="5.5"/>
  </svg>
  <div class="info">
    <div class="label w-label" id="label"></div>
    <div class="time w-display" id="time"></div>
    <div class="hint" id="hint"></div>
    <div class="btns">
      <button class="w-btn" id="main" data-no-drag></button>
      <button class="w-btn" id="side" data-no-drag></button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
